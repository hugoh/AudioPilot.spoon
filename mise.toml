[tools]
node = "24.22.1"
jactionlint = "2.4.0"
biome = "2.5.4"
pinact = "5.0.2"
ghalint = "1.5.7"
gitleaks = "8.30.1"
hk = "2.10.0"
lua = "5.4"
"aqua:Kampfkarren/selene" = "0.32.0"
uv = "0.13.5"
rumdl = "0.3.2"
stylua = "2.6.0"
tombi = "1.9.8"
typos = "1.51.1"
"github:owenlamont/ryl" = "0.27.0"

[env]
HS_MOCK_VERSION = "1.0.0"

[tasks.docs]
run = "uvx --from git+https://github.com/hugoh/spoon-tools spoon-generate-docs"
description = "Generate docs/docs.json and docs/index.html from docstrings"

[tasks.vendor]
run = [
  "npm install",
  "rm -rf vendor",
  "mkdir -p vendor",
  "cp node_modules/sortablejs/Sortable.min.js vendor/Sortable.min.js",
]
description = "Fetch CSS/JS dependencies into vendor/"

[tasks.package]
depends = ["docs"]
run = """
mise run vendor
rm -rf dist
mkdir -p dist/AudioPilot.spoon
cp init.lua editor.html LICENSE README.md docs/docs.json dist/AudioPilot.spoon/
cp -r vendor dist/AudioPilot.spoon/
cd dist
zip -r ../AudioPilot.spoon.zip AudioPilot.spoon
cd ..
rm -rf dist
"""
description = "Build a self-contained AudioPilot.spoon.zip (includes docs.json)"

[tasks.deps]
description = "Install the pinned hs_mock into the project-local .rocks tree"
run = "luarocks install --tree .rocks hs-mock $HS_MOCK_VERSION"
sources = ["mise.toml"]
outputs = [".rocks/lib/luarocks/rocks-5.4/hs-mock/*/rock_manifest"]

[tasks.test]
depends = ["deps"]
run = "busted test_spec.lua --verbose"

[hooks]
postinstall = ["luarocks install busted"]
